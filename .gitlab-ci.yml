# Content validation for archive. It runs the pinned server image (PRD FR-131).
# Never use the `latest` tag. Raise ISLANDLOG_SERVER_VERSION only in a reviewed MR.
# CLI form (ruling R25): islandlog validate [--mode full|mr] [--base <git sha>] [--include-fixtures] <archive dir>.
# MR fields come from CI_MERGE_REQUEST_DESCRIPTION. A warning prints "LABEL privacy-review" and exits 0.

stages:
  - validate

variables:
  # PLACEHOLDER: no server release exists yet (D19). Replace with the first tag.
  ISLANDLOG_SERVER_VERSION: "v0.0.0"
  ISLANDLOG_IMAGE: "registry.gitlab.com/howmay/islandlog/server:${ISLANDLOG_SERVER_VERSION}"
  GIT_DEPTH: "0"

default:
  image:
    name: "$ISLANDLOG_IMAGE"
    entrypoint: [""]

# Content mode: schema, references and file rules on main (PRD B.5 item 1).
validate-content:
  stage: validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
  script:
    - islandlog validate .

# MR mode: also checks the MR fields and the approval rules (PRD B.5 items 3 to 5).
# On a warning the command prints "LABEL privacy-review" and exits 0; a later step must apply the label (open item).
validate-mr:
  stage: validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - islandlog validate --mode mr --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" .

# FR-133 (MR preview with temporary PostgreSQL, server and web) is P1 and is not part of M0.
