quote: （中央社記者葉蓁芸台北22日電）颱風薔琵來襲，台北市政府今天晚間8時宣布，依據交通部中央氣象署最新天氣預報資料，並經基北北桃共識，明天停止上班、停止上課。（編輯：蕭博文）1151022
