quote: 台北市密室逃脫遊戲店員工遭勒頸致死，引發輿論譁然，不過台北市長蔣萬安昨接受市議員林亮君質詢時表示，中央未對密室逃脫明訂安全標準。對此，民進黨不分區立委陳培瑜發文打臉指出，「中央早在106年就訂定『場地安全指導綱領』，蔣萬安竟先甩鍋中央沒訂安全標準」。
