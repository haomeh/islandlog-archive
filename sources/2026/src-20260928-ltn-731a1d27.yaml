quote: 台北市金華國中營養午餐爭議延燒，台北市長蔣萬安與北市教育局日前多次重申金華國中並無食物中毒，強烈抨擊民進黨台北市議員簡舒培「烏龍爆料」、民進黨台北市長參選人沈伯洋「翻車還上車、認知作戰製造恐慌」等。然而，金華國中校長黃啟清在中秋連假期間發表公開信，證實確實有學生食用後身體不適並公開致歉，隨即引發網路
