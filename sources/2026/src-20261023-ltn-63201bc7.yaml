quote: 秋颱薔琵帶來強風，台中市政府昨天（22日）晚上7點就宣布今天停班停課，但今晚7點一到，台中人卻沒等到颱風假訊息，市府說，將評估氣象署最新資料，預計晚間8點公布，再等一下。
