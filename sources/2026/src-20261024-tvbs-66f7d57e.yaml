quote: 海巡署東部分署第一三岸巡隊昨（23）日下午於台東市小野柳露營區執行巡查時，查獲一名越南籍失聯移工。執勤人員在追捕過程中衝入草叢搜捕，不慎遭到蜂群襲擊螫傷，所幸該名移工最終順利遭圍捕到案，受傷的海巡人員經送醫治療後已無大礙，全案已移送移民署專勤隊收容處置。
