quote: 南投名間焚化爐興建案，議員吳棋楠在議會質詢時質疑縣府花1億元環保基金購買預定地，未經議會審議通過，惟縣府回應已納入114年度預算；沈夙崢議員則針對焚化爐環評範疇界定會議開會地點，與環保局長李易書激烈爭辯。
