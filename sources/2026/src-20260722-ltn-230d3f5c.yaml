quote: 近期食安事件連環爆，繼台中中聯致癌油之後，新竹緊接著爆出農耕牌炊粉含不得檢出的有毒甲醛。更扯的是，甲醛毒炊粉是台南市政府早在5月就驗出，可新竹市政府拖到7月中才對外公布，毒炊粉早就被不知道多少人吃下肚。對此，資深媒體人黃智賢忍不住跳出來「指責」其作為台南市長的胞兄黃偉哲，為什麼當初驗到毒粉不學藍白拿
