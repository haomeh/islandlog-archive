quote: 台北市信義區知名密室逃脫「邏思起子」旗艦店，吳姓女員工十日晚間扮演「吊死鬼」角色，準備對玩家進行驚嚇演出時，疑因繩索道具問題窒息，送醫搶救後恢復呼吸心跳，目前仍在觀察中。台北市勞動檢查處昨稽查後表示，經調查現場有未採取必要預防措施、未實施風險評估、吳女未接受職業安全衛生教育訓練共三項缺失，已要求停業
