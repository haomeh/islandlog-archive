quote: 連接新北市八里區和淡水區的淡江大橋，將於明天（12日）通車，卻傳出新北市府沒有收到交通部邀約參與；對此，交通部公路局澄清，通車活動已於9日辦理完畢，明天是由公路局辦理簡單祈福後就開放通車，未再邀請相關機關、首長與民代出席參加。
