accessed_on: '2026-10-25'
has_archive_url: false
quote: （中央社記者吳書緯台北24日電）內政部今天公布「114年特定死因除外之簡易生命表」，去年國人一般平均壽命為81.27歲，若排除惡性腫瘤因素，可增加3.70歲，提升至84.97歲，為10大死因中影響最大者，若排除心臟疾病及肺炎則可分別提升1.54歲及1.13歲。
