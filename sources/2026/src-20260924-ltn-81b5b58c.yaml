title: 金華國中爆午餐食安爭議！詹凌瑀：留樣被丟、教育局最後反批「造謠」
publisher: 自由時報
url: https://news.ltn.com.tw/news/politics/breakingnews/5584394
published_on: '2026-09-24'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 台北市議員簡舒培指出，金華國中師生9月4日在食用含有「小卷」的營養午餐後，多人出現腹瀉、嘔吐等症狀，北市教育局發文澄清，該校並無集體食物中毒，怒斥「不實指控已翻車」，該貼文卻關閉留言。對此，媒體人詹凌瑀表示，先是暫不處理，再來是樣本丟掉，接著蔣萬安14個字推給教育局，最後教育局發新聞稿罵家長造謠。「
