quote: 「薔琵」颱風生成！中央氣象署表示，原本位於關島東方海面上的熱帶性低氣壓TD33，在今天下午2點發展成輕颱「薔琵」，未來會先以西北西方向移動，5天後可能會北轉或偏西，路徑仍有不確定性，民眾應注意最新預報資訊。
