quote: （中央社記者黃巧雯台北24日電）颱風薔琵強度減弱且暴風圈持續縮小，氣象署今天表示，目前彰化以南已脫離暴風圈，預計薔琵下午將減弱為輕颱，傍晚前後解除陸警，晚上至深夜解除海警。
