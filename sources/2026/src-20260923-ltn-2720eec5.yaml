quote: 台北市議員簡舒培爆出金華國中學生教師食用「小卷」營養午餐後，傳腹瀉、嘔吐等疑似食物中毒問題，但學校通報教育局，卻得到「被動處理、暫不處理」的回覆。市長蔣萬安今（23）下午出席道安會報前接受媒體訪問，被問到此事說，「教育局等一下就會對外說明。」
