quote: 強烈颱風「巴威」步步逼近，花蓮山區嚴陣以待！農業部今（6）日下午召開「萬里溪堰塞湖災害緊急應變小組」會議。根據林業及自然保育署花蓮分署最新無人機空拍及監測資料，位於萬榮鄉上游的萬里溪堰塞湖，目前蓄水量已推估達313.44萬立方公尺，占總庫容的61.46%。儘管目前水位尚距離可能溢流口12.55公尺，
