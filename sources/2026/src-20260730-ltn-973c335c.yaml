quote: 內政部將向憲法法庭聲請解散中華統一促進黨，參與內政部政黨審議會運作的人士今日向本報透露，該案是經委員表決通過，認為應該解散統促黨。統促黨是黑道披著政黨外衣，在台灣做政治性暴力攻擊及統戰滲透工作，嚴重破壞自由民主憲政秩序。
