quote: 新竹市爆出明好企業農耕牌炊粉含不得添加及檢出的甲醛食安風暴，市府從5月底接獲台南市府通報後，2個月後仍查不出農耕牌炊粉的甲醛從何而來，到底是原料、還是製程或是人為添加？更讓新竹米粉百年產業商譽也受到波及，竹市衛生局從7月16日到27日擴大抽驗市轄16家米粉業者，其中15家業者共23個品項產品全數未檢
