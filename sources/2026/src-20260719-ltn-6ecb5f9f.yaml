title: 萬里溪堰塞湖紅色警戒 台鐵列車今天全線正常行駛
publisher: 自由時報
url: https://news.ltn.com.tw/news/life/breakingnews/5510177
published_on: '2026-07-19'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 花蓮萬里溪堰塞湖水位距壩頂剩30公分，預估溢流時間約今天（19日）傍晚，但天然壩潰決時間可能為數小時至數日，具高度不確定性。台鐵公司表示，將依據中央災害應變中心裁示隨時採取應變措施，今天24時前全線各級列車正常行駛；明天（20日）12時前列車行駛資訊，將於今天晚間8時前公布。
