quote: 台北市連鎖密室逃脫店「邏思起子」信義旗艦店，昨（10）日晚間發生嚴重工安意外，吳姓女員工扮演NPC角色「吊死鬼」時，疑因繩索道具問題窒息，送醫搶命，而上（4）月民進黨台北市大安文山區議員參選人陳聖文，體驗密室逃脫遊戲，過程中遭壓克力銳片刺入腹部受傷，並召開記者會要求市府盤點密室逃脫場所，產業局也承諾
