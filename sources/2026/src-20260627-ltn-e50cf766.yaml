quote: 在今天八仙塵爆案發生十一周年的前夕，最高法院於昨天做出該案的首例國賠判決！該案釀十五人死、四八四人傷，有十七位死者家屬認為交通部觀光署、新北市政府等怠於執行職務，聲請國賠一億兩千萬元，一、二審均敗訴，但高等法院更一審判觀光署和新北市府連帶賠償七人精神撫慰金各三百萬元，共二一〇〇萬元，昨獲最高法院駁回
