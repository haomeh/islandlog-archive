quote: 淡江大橋將於明天上午11時30分正式通車，不過有交通粉專發布影片指出，淡江大橋護欄不符合設計規範、且螺帽沒包覆，直言若發生意外，恐造成不當後果；對此，交通部公路局澄清，現行相關規範對於一般機車道護欄型式及高度，並未如高速公路車輛防撞護欄有相關規範，該機車道護欄已依核定設計圖說及現場條件施作；另，燈桿
