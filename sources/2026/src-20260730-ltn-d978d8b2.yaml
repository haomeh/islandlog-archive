quote: 內政部今（30）日指出，統促黨核心成員涉嫌違反「國家安全法」、「反滲透法」、「兩岸人民關係條例」，已危害國家安全、社會穩定及選舉公正性，將向憲法法庭聲請解散統促黨。對此，民進黨立委郭昱晴贊同說，政黨運作不能危害自由民主，期待憲法法庭能依據具體事證，做出公正裁決。
