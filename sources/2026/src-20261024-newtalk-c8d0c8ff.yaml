has_archive_url: false
quote: 內政部今（24日）公布「114年特定死因除外之簡易生命表」，2025年的國人一般平均壽命為81.27歲，若排除惡性腫瘤因素，可增加3.70歲，提升至84.97歲，為十大死因中影響最大者；若排除心臟疾病及肺炎則可分別提升1.54歲及1.13歲，其餘死因對平均壽命的影響均在1歲以內。
