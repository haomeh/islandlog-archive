quote: （中央社記者李卉婷屏東縣22日電）颱風薔琵來襲，屏東縣政府今天表示，依中央氣象署最新氣象預報資料，屏東縣明天風力預測已達停止上班及停止上課標準，為確保民眾生命財產安全，宣布明天全縣停止上班、停止上課。（編輯：蕭博文）1151022
