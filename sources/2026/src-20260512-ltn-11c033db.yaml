quote: 連接新北市淡水、八里區的淡江大橋今（12）日通車，新北市府觀光旅遊局規劃「淡江航海趣」慶祝活動，市議員陳偉杰今質詢批評，觀旅局號稱「12公尺千陽號主燈」為全國首座，但實際上，台南市在2023年早就有相關展出，要求局處發布資訊前要加強檢核宣傳，且大型公共建設通車應輔以具在地特色的觀光策劃。觀旅局長楊宗
section: 生活
