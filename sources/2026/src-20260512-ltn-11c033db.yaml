title: 新北「千陽號主燈」慶淡江大橋通車 遭疑非全國首座、台南早就展過
publisher: 自由時報
url: https://news.ltn.com.tw/news/life/breakingnews/5434584
published_on: '2026-05-12'
accessed_on: '2026-10-25'
