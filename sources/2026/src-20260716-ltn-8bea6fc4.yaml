title: 政府人臉指紋差勤設備驚見中國貼牌貨
publisher: 自由時報
url: https://news.ltn.com.tw/news/society/paper/1762861
published_on: '2026-07-16'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 民進黨立委林俊憲昨召開記者會揭露，多個政府機關、機構，採購作為差勤管理的人臉、指紋等生物辨識設備，疑使用中國熵基科技公司產品，恐使大量公務員的人臉、指紋等生物特徵資料暴露於資安風險，形成國安漏洞。他呼籲，政府應從源頭嚴格把關設備來源，以免政府採購成為資安及國安風險的破口。
section: 社會
byline: 記者林哲遠、邱俊福
