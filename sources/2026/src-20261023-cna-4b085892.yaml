quote: （中央社網站）中央氣象署發布颱風薔琵海上陸上颱風警報，根據氣象署最新風雨預報，23日中午前包含北北基、桃竹苗等仍有16縣市達停班課標準，但實際是否停班課將由各縣市政府決定。中央社為您整理最新資訊：
