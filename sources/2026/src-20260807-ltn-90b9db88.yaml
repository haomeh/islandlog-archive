quote: 內政部今天正式向憲法法庭遞件聲請解散中華統一促進黨，今天派內政部主任秘書黃駿逸、民政司長鄭英弘於上午10點30分至憲法法庭遞狀，更創下由機關聲請解散政黨的首例；憲法法庭書記廳回應，本件收案後，後續將由憲法法庭處理。
