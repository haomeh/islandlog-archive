title: 日本巡視船來台避風遭中海警尾隨 海巡批中國勿製造管轄權假象
publisher: 自由時報
url: https://news.ltn.com.tw/news/politics/breakingnews/5616236
published_on: '2026-10-23'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 日本海上保安廳8艘巡視船昨日來台避風，遭5艘中國海警船尾隨跟監，海巡署據報運用聯合情監偵手段，目前全程掌握相關船舶動態；海巡署對此強調，日本在尊重我方執法權的程序下來台避風，應本於人道、互助的精神協助，呼籲中國勿藉颱風製造管轄權及臺海內水化之假象。
