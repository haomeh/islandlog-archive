title: 蔡錦賢抗議淡江大橋揭牌未獲邀 在地里長直言「很瞎」
publisher: 自由時報
url: https://news.ltn.com.tw/news/politics/breakingnews/5434942
published_on: '2026-05-12'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 淡江大橋今天上午11點半正式通車，交通部早上同時為橋梁管理中心揭牌，但新北市議員蔡錦賢和在地里長卻到場抗議，認為揭牌儀式沒邀請地方民代，對淡水人非常不禮貌。不過也有在地里長認為該場抗議「很瞎」，淡水區崁頂里長吳庭岳說，通車典禮9日就辦過了，祈福儀式有沒有參加到，真的有這麼重要嗎？
section: 政治
byline: 記者黃政嘉
