quote: 新竹市農耕牌炊粉6大品項含不得添加的甲醛毒米粉事件。時代力量主席王婉諭表示，台南市衛生局早在今年5月底即驗出新竹次明好企業生產的「濁水炊粉」含甲醛並通報竹市府，初驗4件更有3件違規。不料，新竹市政府不僅未即時通知下游廠商與消費者，更將6月底出爐的複檢結果硬生生拖到7月18日才公布，目前高達8成以上的
