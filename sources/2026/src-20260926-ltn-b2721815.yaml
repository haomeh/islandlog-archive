quote: 台北市政府近來因頻繁修剪或移除行道樹及老樹，引發網路討論與爭議。台灣人工智慧實驗室創辦人杜奕瑾表示，圓環的樹同時得到絕症可能性多高？1個老人突然存款變少，可能是特例，5個老人同時短少就該報警調查。台北市公園及路燈管理工程處表示，4株鳳凰木陸續因為褐根病、風災倒伏等狀況移除，該處尚有3個樹穴因配合路口
