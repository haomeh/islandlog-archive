quote: （中央社記者張榮祥台南22日電）移民署台南市專勤隊今天宣布在歸仁區某處工地查獲14名失聯移工及逾期停留外籍人士，這些人被4間企業社的5名雇主以日薪新台幣1700元至2000元非法聘用，訊後依法處理。
