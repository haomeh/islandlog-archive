quote: 爭議延燒逾2年的「彰化縣生命園區」預定明（28）日上午舉行動土典禮，長期反對設置火葬場的二林芳苑反火葬場自救會，宣布上午8時30分集結，預計動員200至300人到場和平陳抗，高喊「停止動工、重啟對話」，進行最後訴求。
