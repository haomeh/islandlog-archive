title: 竹市爆有毒甲醛炊粉食安風暴 藍營議員徐美惠開第一槍籲食安零容忍
publisher: 自由時報
url: https://news.ltn.com.tw/news/life/breakingnews/5512698
published_on: '2026-07-21'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 新竹市農耕牌濁水炊粉驗出含有毒甲醛的食安風暴，外界批高虹安市府在5月底台南市府驗出後，隔了7週直到7月18日才對外公布，且僅回收下架867包、不到2成的有毒炊粉是蓋牌及隱匿資訊，包括白營及藍營對新竹有毒炊粉食安風暴都靜悄悄未表態，國民黨市議員徐美惠今天開第一槍，在臉書發文稱有毒炊粉已嚴重動搖市民對食
section: 生活
byline: 記者洪美秀
