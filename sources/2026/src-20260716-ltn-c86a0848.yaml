quote: 新北市三峽區今清晨6時許發生死亡車禍，41歲陳姓女子騎機車沿介壽路3段往三峽方向行駛，行經火葬場附近時，機車後車尾突遭後方由59歲葉姓男子駕駛的曳引車碰撞，陳女當場連人帶車倒地，不幸遭曳引車沉重車輪輾過，下半身遭受大面積撕裂重創。消防救護人員趕抵現場時，確認陳女已明顯死亡、未送醫。
