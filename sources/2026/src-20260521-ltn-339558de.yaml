quote: 密室逃脫近期意外事件頻傳，文化局今（21）日發布產業安全指引。台灣沉浸式體驗協會秘書長馬偉軒指出，該產業安全指引主要適用於「密室逃脫」、「沉浸式劇場」兩大業別。馬偉軒示警，除了本次發生意外的遊具安全需要特別關注外，「恐怖追逐」類的危險程度，其實不亞於本次意外，因為遊戲的過程中，玩家會因為追逐、恐慌，
