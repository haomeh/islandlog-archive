title: 《慈善會活動發肉粽及提杯值500元》屏東統促黨里長參選人涉賄 3人羈押禁見
publisher: 自由時報
url: https://news.ltn.com.tw/news/life/paper/1773171
published_on: '2026-10-04'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 屏東地檢察署檢察官蔡瀚文偵辦統促黨幹部、潮州鎮四春里長參選人潘建邦，在兼任萬眾慈善會總幹事時，與萬眾慈善會陳姓理事長、蔡姓理事及鍾姓男子等四人，於今年六月十三日以萬眾慈善會活動名義，向選民發放肉粽及提杯（價值共五百元以上）賄選案件，認為潘、陳、蔡三人違反選罷法，犯嫌重大，有串證之虞，二日深夜向法官聲
section: 生活
byline: 記者葉永騫、蔡宗憲
