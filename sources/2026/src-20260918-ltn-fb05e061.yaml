quote: 回顧中華統一促進黨近年涉入的重大事件，包括涉嫌圍堵香港民運領袖黃之鋒、在台大持甩棍毆打學生、對香港歌手何韻詩潑漆，該黨幹部更涉嫌收受中國逾7400萬元資金介選；安全人士示警，年底選舉至少15名參選人與統促黨有關，這樣利用民主的開放性破壞民主、濫用民主的風險令人憂心。
