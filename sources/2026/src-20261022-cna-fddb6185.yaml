quote: （中央社記者汪淑芬台北22日電）農業部為強化廚餘風險管控及非洲豬瘟防疫管理，今天修正違規搬運廚餘並使用不符條件的廚餘餵豬隻，首次違規罰鍰，由各新台幣20萬元提高至各50萬元，首次合計將裁罰100萬元。
