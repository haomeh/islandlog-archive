quote: 高雄市政府前天傍晚第宣布10月23日停班停課，23日上午卻出現太陽，引發部分網友非議。國民黨高雄市長候選人柯志恩今天，昨天上午雖然風和日麗，但中午過後風勢蠻大的，她相信縣市長對颱風假的判斷，都有其專業考量。
