has_archive_url: false
quote: （中央社記者劉世怡台北22日電）主富公司（NET）不滿基隆市政府強制接管東岸商場，興訟請求確認違法並求國賠，一審遭駁回提抗告。最高行政法院認定市府接管屬事實行為，非行政處分，不符起訴要件，今天駁回抗告確定。
