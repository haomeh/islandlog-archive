quote: 新竹市爆明好企業生產的農耕牌炊粉含不得添加及檢出的致癌物甲醛，台南市府5月底驗出後，新竹市府直到7月18日才對外公告，家長擔心孩子學校營養午餐可能吃到有毒甲醛炊粉，自救上網翻查孩子的餐盤資訊，竟發現有多達34所學校有使用到明好企業提供的炊粉與水粉。
