quote: 薔琵颱風今天（15日）下午2點生成，中央氣象署預報，預估後天（週六）會增強為中颱，下週一左右再發展成強颱，5天內會先以偏西至西北西移動，後續到琉球南方海面時，可能會北轉或偏西移動，若太平洋高壓減弱不明顯可能會比較接近台灣，目前預估北轉機率較高，仍需觀察，但下週三起部分沿海地區要留意長浪。
