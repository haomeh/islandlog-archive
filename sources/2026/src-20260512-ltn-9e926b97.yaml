title: 陳世凱參加淡江大橋通車活動立院備詢請假 藍委：觀感不好
publisher: 自由時報
url: https://news.ltn.com.tw/news/politics/breakingnews/5433909
published_on: '2026-05-12'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 立法院會上午繼續進行施政總質詢，交通部長陳世凱因出席淡江大橋通車典禮而請假，國民黨立委林沛祥表示，上週淡江大橋已經舉辦過開工典禮，部長應在國會接受質詢，「我想對於立法院的不尊重是顯而易見，對交通組委員的質詢觀感是不好的」。對此，行政院長卓榮泰回應，會請陳世凱向委員做必要的溝通，希望委員能對今天陳世凱
section: 政治
byline: 記者林欣漢
