quote: 熱帶擾動96W持續發展，今（14日）有機會成為熱帶性低氣壓，明後天（15-16日）再進一步增強為今年第29號颱風「薔琵」，預報資料顯示薔琵可能會是一個強度較強且範圍較大的颱風，若轉向點偏西，不排除外圍雲系間接影響台灣天氣的可能性，因此下週後半的天氣變動度比較大。
