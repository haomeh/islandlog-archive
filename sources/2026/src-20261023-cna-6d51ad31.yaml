quote: （中央社記者劉建邦台北23日電）海巡署表示，針對中國海警船尾隨在澎湖七美西南方海域防颱的8艘日本海上保安廳巡視船，已掌握船舶動態。中國海警船企圖製造具管轄權及台海內水化假象，危害海上航行自由。
