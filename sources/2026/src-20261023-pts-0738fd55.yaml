quote: 農業部強調，今（2026）年統計至10月22日，共查獲26件違規搬運或使用廚餘的案件，其中未獲廚餘再利用許可的有24件，占9成2，比例最高；也重申明（2027）年元旦起全面禁止廚餘餵養豬隻的政策並未改變，業者應及早規劃、完成轉型。
