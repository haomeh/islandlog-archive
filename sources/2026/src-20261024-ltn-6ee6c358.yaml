quote: 颱風薔琵襲台，夾帶強風雨勢，經整晚的肆虐，台北市消防局統計，至今早8時許，北市包含路樹傾倒（樹枝掉落）、廣告招牌毀損、道路及交通號誌毀損等零星案件，共達1635件災情，造成31人受傷，其中以路樹枝幹傾倒、掉落867件為最多。
