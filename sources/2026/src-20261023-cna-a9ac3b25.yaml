quote: （中央社記者張榮祥台南23日電）颱風薔琵逼近，台南市災害應變中心今天上午一級開設，台南市長黃偉哲召開工作會報表示，台南可能進入7級風暴風半徑，他已要求各單位提高警覺，落實防颱，減少災損。
