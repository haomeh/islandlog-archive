title: 一觸即發！彰化芳苑火葬場今辦說明會 自救會：選址不當立即撤案
publisher: 自由時報
url: https://news.ltn.com.tw/news/life/breakingnews/5425615
published_on: '2026-05-05'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 彰化縣府將在今天（5日）於芳苑鄉福海宮，舉辦「彰化生命園區（火化場）」開發案動工前說明會。二林芳苑反火葬場自救會已動員將到場表達撤案的訴求。自救會表示，火化場選址不當，爭議問題仍未解決，他們今天自救會在動工前說明會遞交陳情書，唯一訴求「選址不當，立即撤案」。
section: 生活
byline: 記者顏宏駿
