quote: （中央社記者李念庭台北22日電）一名印尼籍移工非法販售墮胎藥，並仲介移工至簡陋診所流產。台北地院今天一審宣判，依圖利受託使婦女墮胎罪共19罪，判處2年6月徒刑，沒收100萬元不法所得。可上訴。
