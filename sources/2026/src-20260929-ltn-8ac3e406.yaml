title: 北市府曾稱議員「烏龍、翻車」 營養午餐釀不安 金華國中校長道歉
publisher: 自由時報
url: https://news.ltn.com.tw/news/politics/paper/1772495
published_on: '2026-09-29'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 台北市大安區金華國中本月四日傳出學生食用營養午餐的小卷後腹瀉，民進黨議員簡舒培披露此事，市府教育局稱議員「烏龍、翻車」，校長黃啟清中秋連假在學校官網發布公開信，向身體不適或受影響的同學表達關心與歉意。
