quote: 熱帶性低氣壓TD33預計今、明兩天發展成輕颱「薔琵」，對此，氣象粉專「台灣颱風論壇─天氣特急」指出，準薔琵即將通過海水熱焓量偏高的區域，海洋提供的能量有可能讓薔琵達到強烈颱風，就目前模式預估來看，朝日本方向靠近的可能性較高，但仍不能完全排除會影響台灣。
