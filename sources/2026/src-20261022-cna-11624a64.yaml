quote: （中央社記者黃國芳嘉義市22日電）颱風薔琵接近台灣，嘉義市已列入陸上警戒區域，另依據國家災害防救科技中心資訊，薔琵於明天中午起至傍晚影響最劇，嘉義市受颱風及外圍環流影響，有強陣風達10級發生機率，鑑於市民生命財產安全，嘉義市政府宣布，明天（10/23）停止上班、停止上課。（編輯：蕭博文）115102
