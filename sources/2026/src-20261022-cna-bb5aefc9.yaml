quote: （中央社網站）中央氣象署發布颱風薔琵海上陸上颱風警報，23日白天至晚間是颱風距離台灣最近的期間，各地區應嚴加戒備，防範強風豪雨。北部與宜蘭山區慎防豪雨等級以上降雨，沿海地區與西半部平原普遍將有9至11級強陣風。包括台北市、新北市等21縣市23日放颱風假，全台僅金門縣照常上班、上課。中央社持續更新各地
