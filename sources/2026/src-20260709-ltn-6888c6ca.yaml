quote: 中聯油脂案延燒超過1週，行政院今天舉辦院會後記者會，衛福部長石崇良在會中提到，有出席的副市長詢問何時上架的問題，且「若沒記錯，記得是桃園跟台中」，但衛福部於傍晚澄清，會中「台中表示要求全面下架，桃園則反映業者也有生計的問題」。
