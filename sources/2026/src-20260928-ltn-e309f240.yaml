quote: 民進黨台北市議員簡舒培日前爆料，大安區金華國中學生教師食用午餐小卷後出現腹瀉等症狀，市府稱其發言為「造謠」、「已翻車」，更有多位國民黨議員至金華國中替政府護航。然該校校長發出公開信，向此次身體不適、對用餐感到不安或受到事件影響的同學們，表達關心與歉意。當初揭露事件的簡舒培今（28）日受訪說道，本月1
