quote: 日前有臉書粉專指高雄有多人因食用馬鈴薯中毒，桃園地檢署民生專組檢查官王念珩指揮法務部調查局資安工作站偵辦，廿七日晚間約談桃園市五十一歲汪姓男子到案說明，訊後向法院聲押汪男，桃園地院法官考量犯罪情節及比例原則，昨天裁定二萬元交保。
