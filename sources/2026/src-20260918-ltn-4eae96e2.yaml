quote: 內政部向憲法法庭聲請解散統促黨，然而年底九合一大選，仍有15名統促黨相關人士登記參選。對此，政治大學法學院副教授林佳和今（18日）表示，統促黨過去行徑與「憲法」為敵，明顯屬於違憲政黨，無奈現在還無法將其解散，依法也無法阻止這些人參選，須由選民發揮政治智慧。
