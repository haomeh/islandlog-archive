quote: 中聯油脂一級致癌物「苯駢芘」超標案，檢方持續向上追查決策鏈，繼總經理余凌冲遭羈押禁見後，廠長陳明榮羈押攻防也出現重大逆轉，台中高分院審理後認定抗告有理由，認為陳明榮案發前就已經跟相關人有「隱匿共識」，撤銷台中地院命陳以200萬元交保裁定，發回台中地院重新裁定。
