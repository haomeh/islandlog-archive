quote: 22日凌晨，台南市安南區海佃路二段1處空地發生堆放的事業廢棄物火災大爆炸案，台南地檢署檢察官指揮警方偵辦，於昨下午拘提涉案的鄭姓里長、楊姓仲介與龔姓共犯等3男子到案，並依3男犯嫌重大、有串滅證、逃亡之虞，今天向台南地院聲押3男嫌禁見獲准。
