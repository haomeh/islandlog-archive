quote: 薔琵颱風來襲，桃園市長張善政下午先後到蘆竹區果菜滾動式倉儲設施、大園區南崁溪斷面03至斷面08之1護岸改善工程視察，針對大園區沙崙里長游素珠反映南崁溪出海口石礫堆積嚴重問題，張善政已要求水務局儘速安排現勘以研擬對策。
