quote: 民進黨苗栗市長參選人林月琴，昨（26日）質疑競選對手、國民黨籍苗栗市長余文忠，讓本應是全民公共財的苗栗市全民運動館，委外經營後成為私人企業創造獲利的工具；余回應公所自營球場兼顧公益權益，請林親身去體驗，切勿唱衰地方。林月琴今天再質疑公所決標後量身改約、降低業者責任，猶如「苗栗版馬關條約」；余則不再回
