quote: 台北市議員簡舒培昨踢爆金華國中9月初師生食用含有「小卷」的營養午餐後，多人出現腹瀉、嘔吐等症狀，質疑教育局接獲通報卻回覆「由學校被動處理」，還稱「有許多特殊，暫不處理」；且校方9月中才向家長說明，午餐樣本早已丟棄。教育局駁斥說，當天有三名學生身體不適，但症狀不同，其他班級師生也無相關反應，排除食品中
