quote: 台北市密室逃脫業者員工因角色扮演鬧出人命，台北市議員簡舒培今（25日）在議會指出，從5月10日事發至今，最重要的是亡羊補牢，卻只看到市府、甚至連第一線的局處首長都在推卸責任；事實上，內政部消防署早在2017年2月8日頒布《互動情境體驗場所安全指導綱領》，但市府相關單位從未依照綱領去檢查，她將把相關資
