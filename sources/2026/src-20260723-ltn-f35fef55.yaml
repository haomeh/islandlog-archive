quote: 新竹市爆發明好企業農耕牌炊粉含不得檢出的甲醛炊粉食安風暴，重創新竹米粉產業形象，雖僅一家業者傳出含有毒甲醛米粉，但其他米粉業者也受到波及，有新竹在地米粉業者稱四十、五十年前曾聽過老一輩為讓米粉色澤較白，會添加俗稱吊白塊（含甲醛）的工業用材料漂白，當時事件爆發後，所有米粉業者在製程中都不曾再使用，沒想
