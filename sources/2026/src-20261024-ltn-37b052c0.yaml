quote: 薔琵颱風帶來強風，台中市昨（23日）放颱風假，全市各大百貨公司也都跟著暫停營業一天，台中市政府宣布今天再停班停課一天，不過，今日台中風雨變小，包括台中新光三越、漢神洲際及大遠百等各大百貨公司幾乎全開館營業，中午後各百貨公司均湧人潮，漢神洲際除美食街人氣滿滿，連名品街也出現逛街人流，雖是颱風天，業者直
