quote: （中央社記者沈佩瑤台北23日電）颱風薔琵來襲，台北市政府宣布明天停班停課，連2天放颱風假。為解決民眾就醫需求，長庚、國泰等各大醫院門診幾乎暫停，但透析、急診正常，部分醫院開設颱風特別門診。
