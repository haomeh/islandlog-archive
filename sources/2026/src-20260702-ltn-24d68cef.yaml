quote: 高市衛生局針對衛生福利部食品藥物管理署公告，中聯油脂公司提供泰山、福壽及福懋等業者使用的大豆沙拉油，自主檢驗時檢出苯駢芘（Benzo[a]pyrene,BaP），未符食品中污染物質及毒素衛生標準，今（2）日清查92家賣場，並要求轄內超市賣場、校園、醫院、餐廳、長照機構及市場等業者清查下架回收。
