quote: 中華統一促進黨長期配合中國統戰、滲透，涉及多起刑事暴力事件，內政部日前已向憲法法庭聲請違憲解散。不過，安全單位比對發現，今年九合一大選至少有十五名統促黨員或相關人士登記角逐各級民意代表，多數人試圖透過無黨籍參選「洗白」，令人憂心年底選舉被「染紅又染黑」。
