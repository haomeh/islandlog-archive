quote: 新北市新店區碧潭大橋今天傍晚5時許，發生失聯移工躲避警方盤查跳橋受傷事件。新店分局員警在該路段執勤時，發現一名外籍男子騎腳踏車搖晃，準備上前關切盤查時，男子突拔腿狂奔從碧潭橋頭一躍而下，墜落2層樓半地面，導致男子全身多處擦挫傷送醫治療，經警方查詢後，確認男子為越南籍失聯移工，待治療後移送移民署專勤隊
