quote: （中央社記者吳書緯台北24日電）颱風薔琵過後，國軍第3作戰區今天配合地方政府災害防救需求，派遣救災兵力及機具，前往新北市、宜蘭縣等7個鄉鎮市，協助排除道路障礙、清理環境及執行災後復原，儘速恢復道路通行及民眾正常生活。
