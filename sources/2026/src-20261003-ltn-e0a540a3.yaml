quote: 屏東查察賄選最新斬獲！屏南某鄉鎮傳出全國首起「統促黨幹部身分」因送禮惹議的里長參選人賄選案，該名潘姓里長參選人涉嫌在端午節期間，大動作向選民贈送價值超過法定三十元標準的肉粽及精美水壺，藉此拉攏人心；經屏東檢警調深入追查、蒐證後，昨天展開大規模傳喚與搜索行動，檢方認為潘嫌涉嫌重大，正漏夜偵訊中。
