title: 《議員揭金華國中爆食安問題 市府批不實指控》教局砲口對沈伯洋︰翻車了還上車
publisher: 自由時報
url: https://news.ltn.com.tw/news/politics/paper/1772066
published_on: '2026-09-25'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 台北市政府針對網友轉發北市砍樹爭議貼文、分享看法提告；市議員簡舒培爆料金華國中出現疑似食安問題，被教育局駁斥不實指控翻車。教育局長湯志民昨拍影片回擊，並罕見點名沈伯洋，還用「翻車了還要上車」等政治語言。自沈伯洋宣布參選以來，市府許多局處也轉變「戰鬥模式」，不僅頻點名沈伯洋，還常用「打臉」、「翻車」等
