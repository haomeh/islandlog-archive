quote: （中央社記者張祈花蓮縣22日電）颱風薔琵來襲，花蓮縣府依據最新氣象預測，境內濱海地區風力達停班課標準，考慮一日生活圈縣民通勤安全，宣布明天全縣停止上班上課。（編輯：管中維）1151022
