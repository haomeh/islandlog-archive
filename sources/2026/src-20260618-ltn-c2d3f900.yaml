quote: 美式賣場好市多前年爆發「A型肝炎莓果」事件，台中市食安處重罰好市多200萬元敗訴，市府竟逾期1天才提上訴狀，導致處分遭撤銷，引發嘩然；多名民進黨台中市議員痛批離譜至極，市府公信力失守，嘆台中市長盧秀燕任期剩半年，「盧市府螺絲全部鬆掉了」。
