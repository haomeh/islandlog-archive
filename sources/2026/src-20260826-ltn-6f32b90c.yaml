quote: 民進黨苗栗市長參選人、立委林月琴今（26日）指出，苗栗市全民運動館由World Gym營運，鄉親反映幾乎比照私人健身俱樂部運作，她認為全民運動館是全民的公共財，不該成為私人企業創造獲利工具。苗栗市長余文忠則表示，公所自營球場兼顧公益權益，請林月琴親身去體驗，切勿唱衰地方。
