title: 金華國中學生4日食用午餐出現不適狀況 北市衛生局：改抽驗24日餐食
publisher: 自由時報
url: https://news.ltn.com.tw/news/life/breakingnews/5588716
published_on: '2026-09-28'
accessed_on: '2026-10-25'
