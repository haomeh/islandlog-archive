quote: 台北市議員簡舒培23日揭露，大安區金華國中師生4日食用午餐小卷後身體不適，遭市府批「翻車」、「造謠」、「認知作戰」。該校校長於今日發布道歉信，關切受影響之學生。衛生局今日回覆該案進度，表示4日食物已無法獲取，改抽驗24日餐食，檢驗結果需2週才出爐。
