title: 密室逃脫員工釀死案 吳欣岱批蔣萬安依循「不沾鍋SOP」把責任丟給中央
publisher: 自由時報
url: https://news.ltn.com.tw/news/politics/breakingnews/5439698
published_on: '2026-05-17'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 針對近期台北市密室逃脫場館發生29歲女員工因扮「吊死鬼」不幸窒息喪命的悲劇，以及台北市長蔣萬安事後稱「密室逃脫缺乏統一管理制度，將與中央齊力推動」的發言，台灣基進台北市內湖、南港區市議員參選人吳欣岱指出，蔣萬安永遠依循「不沾鍋SOP」將責任推諉給中央。吳欣岱呼籲，北市府應扛起地方行政權的責任，立刻動
section: 政治
byline: 記者蔡愷恆
