quote: 民意代表經常參加選民或其家屬的告別式，藉此表達關心，但有家屬投訴，新北市洪姓議員亂入火葬場，在家屬哭得唏哩嘩啦、最重要功德圓滿時刻，司儀還要忙著介紹民代致哀，讓家屬不滿；記者查證後，被指涉的是國民黨籍市議員洪佳君，她喊冤說，經常參加告別式、關心選民，她不會刻意要做什麼，如果讓家屬不舒服，她會關心了解
