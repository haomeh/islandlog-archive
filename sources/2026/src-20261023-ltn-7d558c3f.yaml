accessed_on: '2026-10-25'
has_archive_url: false
quote: 立法院十六日三讀通過《老人福利法》第廿二條修正，六十五歲以上且綜合所得稅率未達廿％的長者改由中央補助，引發討論。民進黨新北市長候選人蘇巧慧在立院表決時並未同意此案，她昨天接受資深媒體人趙少康等人專訪時表示，若把健保費補助定位為長者福利，且由中央統一負擔、全國一致實施，她可接受，未來若當選市長，也會向
section: 政治
byline: 記者黃子暘
