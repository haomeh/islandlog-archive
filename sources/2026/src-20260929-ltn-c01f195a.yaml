title: 蔣萬安視察金華國中測鹹度 挨轟「壞掉的小卷問題是出在太鹹嗎」
publisher: 自由時報
url: https://news.ltn.com.tw/news/politics/breakingnews/5589749
published_on: '2026-09-29'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 民進黨籍台北市議員簡舒培23日爆料大安區金華國中營養午餐食安問題，市長蔣萬安今午用餐時間前往金華國中視察，指出校方從菜單設計到實際供餐，都有完整的溝通與回饋機制，並使用儀器測試鹹度；不過令人疑惑的是，外界質疑的是小卷等食材新鮮與否，蔣卻跑測食物鹹度，「這跟大家現在追問的事情有什麼關係？」
section: 政治
byline: 記者董冠怡
