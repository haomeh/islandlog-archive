quote: 中度颱風薔琵逼近台灣，受到颱風外圍環流及東北季風雙重影響，全台各地風雨逐漸增強，百貨業者也陸續宣布營業調整。BELLAVITA寶麗廣場公告後，京站、汐止iFG遠雄廣場、101也相繼跟進，今（23）早新光三越和遠東SOGO也宣布暫停營業，提醒民眾出門前務必確認營業資訊。
