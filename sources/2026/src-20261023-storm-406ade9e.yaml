quote: 因應薔琵颱風來襲，台中市政府22日晚啟動災害應變中心一級開設，市長盧秀燕今日上午主持第二次工作會報，掌握最新颱風動態及各區災情。盧市長表示，台中市幅員遼闊，各區風雨情況差異甚大，雖然市區上午看似平靜，但山區及海線風勢強勁，其中大甲松柏地區最大陣風已達12級，足以將人吹倒，呼籲市民切勿掉以輕心，非必要
