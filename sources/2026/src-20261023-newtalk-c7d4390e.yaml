quote: 有關日本海上保安廳巡視船航行台灣海峽避風，發生中國海警船尾隨跟監事項，海巡署今 ( 23 ) 日回應媒體詢問表示：「日本在尊重海巡署執法權的程序下來台避風，我們應本於人道、互助的精神協助，呼籲中國勿藉颱風製造管轄權及台海內水化之假象」。
