quote: 台北市大安區金華國中營養午餐爭議延燒，校長黃啟清中秋連假在學校官網發布《給全校師生的公開信》，回應近日在媒體上的營養午餐爭議，坦承有收到有名學生告知，並向此次身體不適、對用餐感到不安或受到事件影響的同學們，表達關心與歉意。
