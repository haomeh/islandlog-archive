quote: 台南市安南區發生嚴重的危險廢棄物起火爆炸事故，經相關單位調查，該處違法堆置鎂鋁合金廢渣，涉案業者來自高雄鼓山。在地議員李中岑表示，強烈譴責黑心業者跨縣市傾倒危險廢棄物的惡劣行徑，也呼籲市府全面體檢危險廢棄物堆置場。
