quote: 民進黨苗栗市長參選人林月琴，連兩天質疑競選對手、國民黨籍苗栗市長余文忠讓本應是全民公共財的苗栗市全民運動館，委外經營後成為私人企業創造獲利的工具；余回應公所自營球場兼顧公益權益，引進專業營運避免淪「蚊子館」，請林親身去體驗，切勿唱衰地方。
