quote: 受到薔琵颱風影響，日本海上保安廳（JCG）多達8艘主力巡視船，因太平洋風浪過大，集體變更航線駛入台灣海峽避風，不過卻發生中國海警船尾隨跟監，對此，海巡署今（23）日表示，中國勿藉颱風製造管轄權及台海內水化的假象。
