title: 嘉市長、議員候選人抽籤遇薔琵颱風是否延期？市選委會回應了
publisher: 自由時報
url: https://news.ltn.com.tw/news/politics/breakingnews/5614868
published_on: '2026-10-22'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 強颱「薔琵」來勢洶洶，嘉義市長及議員候選人抽籤是否延期，成為地方關注焦點。嘉市選舉委員會表示，依中選會通函規定，如23日因颱風來襲經嘉義市政府宣布停止上班，候選人號次抽籤改27日舉行。若23日沒有宣布停止上班，仍正常上班時，則當日照常舉行抽籤。
section: 政治
