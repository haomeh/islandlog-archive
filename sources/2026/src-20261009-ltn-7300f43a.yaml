quote: 因詐欺案件通緝中的29歲朱姓男子，今天上午6點多，駕駛休旅車載著4名已通報失聯的越南籍移工，準備去工作，途中因朱男變換車道未使用方向燈，被桃園警分局武陵派出所巡邏員警逮回，警方訊後，除朱男依法歸案外，4名移工都已移請相關單位辦理收容。
