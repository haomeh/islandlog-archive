quote: 台中市北屯區剛發生「新平好室」社宅工地悶燒超過14小時大火，濃煙瀰漫整個市區，不少居民心有餘悸，不料15日附近一間烤鴨店傳出火警，黑煙從店內不斷竄出，民眾趕緊通報，短短3天接連兩起火警，不少網友直呼：「最近到底怎麼了？」
