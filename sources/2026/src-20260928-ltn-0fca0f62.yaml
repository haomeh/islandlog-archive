quote: 台北市議員簡舒培日前揭露，大安區金華國中師生食用午餐小卷後身體不適，遭市府批「翻車」、「造謠」、「認知作戰」。該校校長黃啟清今（28）日發布道歉信，關切受影響之學生。他後續也拍攝影片表示，這幾天因為一些與事實不符的訊息，讓家長感到擔心，也讓學生跟第一線同仁承受不少輿論壓力，「這是我最不希望看到的。」
