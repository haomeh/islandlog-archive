quote: （中央社記者梁家柔台北21日電）颱風薔琵持續接近台灣，台灣自來水公司今天召開緊急應變會議，盤點防颱整備。台水表示，目前全台清、配水池皆採高水位操作，並備妥574台緊急發電機，同時調度61台水車，全力降低颱風帶來的影響。
