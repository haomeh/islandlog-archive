accessed_on: '2026-10-25'
has_archive_url: false
quote: （中央社記者沈如峰宜蘭縣24日電）交通部觀光署東北角及宜蘭海岸國家風景區管理處今天表示，龜山島受颱風薔琵嚴重侵襲，島上設施受損，明天起暫停開放遊客登島，恢復開放日期視修復進度後再公告。
