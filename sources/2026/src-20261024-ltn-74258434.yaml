quote: 薔琵颱風帶來強風，台中市昨（23日）放颱風假，全市各大百貨公司也都跟著暫停營業一天，評估颱風威脅未完全解除，台中市政府宣布今天再停班停課一天，不過，今日台中風雨變小，包括台中新光三越、漢神洲際及大遠百、中友百貨、Mitsui Shopping Park LaLaport 台中等，已陸續宣布今日正常營
