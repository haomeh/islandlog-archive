quote: 明年各縣市統籌分配款出爐，基隆市獲配額度比去年增加，但因其他中央補助款遭刪減，市長謝國樑指二年來歲入短少一四〇億元，對基隆不公平；民進黨基隆市長參選人童子瑋批評，謝國樑曾公開表示「基隆市府不會在意最後的分配比率」，如今預算減少，就是謝配合政治鬥爭的代價。市府副發言人吳禹辰表示，謝國樑會持續爭取基隆應
