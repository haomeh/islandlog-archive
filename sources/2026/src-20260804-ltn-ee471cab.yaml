title: 超額採購浪費公帑？花蓮避難包「2萬組堆倉庫」 消防局回應了
publisher: 自由時報
url: https://news.ltn.com.tw/news/society/breakingnews/5528062
published_on: '2026-08-04'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 花蓮縣消防局去年採購緊急避難包，總量達13.5萬組，但因需求評估不周延，8個月過去仍有2萬多組滯留倉庫，還被審計室踢爆廠商違約，沒有檢查救護包內物品有無過期風險！對此消防局表示，尚未領取的民眾仍可前往13鄉鎮公所領取，且廠商也已補進行巡檢，確保物資未過期。
