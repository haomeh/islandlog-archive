title: 中聯大豆沙拉油致癌物超標 綠議員張維倩籲新北市府清查流向
publisher: 自由時報
url: https://news.ltn.com.tw/news/life/breakingnews/5491145
published_on: '2026-07-02'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 台中的中聯油脂生產的大豆沙拉油爆出一級致癌物「苯駢芘」超標，影響泰山、福壽及福懋等中下游業者，業者啟動回收機制，新北市議員張維倩則要求新北市府立即全面清查流向；新北市衛生局今回應，衛生局啟動專案查核，針對賣場超市等販售通路加強稽查，確認相關批號產品下架回收落實情形；教育局也要求廠商、學校自立廚房清查
section: 生活
byline: 記者黃政嘉
