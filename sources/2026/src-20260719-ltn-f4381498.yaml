title: 竹市農耕炊粉檢出甲醛  業者：原物料送驗全合格將續追原因
publisher: 自由時報
url: https://news.ltn.com.tw/news/life/breakingnews/5510528
published_on: '2026-07-19'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 台南市政府衛生局日前在竹市明好企業社農耕牌濁水炊粉檢出甲醛，竹市衛生局要求業者全面回收違規批次產品並限期改善製程與原料品管機制，同時需提供民眾退換貨窗口管道。業者今發聲明表示公司與主管機關的目標完全一致，務必儘快釐清污染來源，避免有甲醛殘留的產品流入市場，確保消費者食用安全。
section: 生活
byline: 記者蔡彰盛
