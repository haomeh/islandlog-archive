quote: （中央社澎湖縣24日電）薔琵颱風外圍風力加上的東北季風雙重肆虐，澎湖共計有37件災情，澎湖濱臨海岸的林木與綠地也遭「鹽水煙」重創，就連爬蟲類也都尋找適當據點避險。
