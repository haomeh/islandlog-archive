quote: 好市多2023年爆出A型肝炎莓果事件，台中市府針對台中2家分公司延遲2週才回收，分別重罰100萬，好市多不服裁處，提起行政訴訟勝訴，食安處今年4月提起上訴卻發生離譜疏失，逾期1天遞狀被法院駁回，也導致200萬罰單確定撤銷。
