title: 準「薔琵」不排除侵台？最新路徑曝北轉關鍵 颱風論壇：恐成又大又強的強颱
publisher: 自由時報
url: https://news.ltn.com.tw/news/life/breakingnews/5607028
published_on: '2026-10-15'
