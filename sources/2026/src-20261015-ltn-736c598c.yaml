quote: 熱帶性低氣壓「TD33」最快今（15日）下午有機會增強為國際編號第30號（氣象署編號29號）颱風「薔琵」，預估將成為一個又大又強的強烈颱風；「薔琵」生成後將一路西行，到下週四（22日）過後開始隨太平洋高壓減弱而北轉，而高壓減弱影響「薔琵」哪裡北轉、轉彎幅度有多大，甚至不排除侵台。
