quote: 台北市信義區1家密室逃脫遊戲店昨晚發生驚悚意外，30歲吳姓女員工扮演上吊鬼魂時，遭繩索勒住頸部窒息而失去生命跡象，所幸現場人員緊急將她救下，送醫搶救後恢復心跳，吳女家屬事後接獲通知到場，不滿店家處置，已對業者提出過失傷害及過失致重傷害告訴，警方已受理，將公司負責人函送偵辦。另對店家營業項目及職場安全
