quote: 台北市密室脫逃業者「邏思起子」一名女員工扮鬼時遭繩索勒頸而窒息，搶救不治。市長蔣萬安今天（17日）上午出席公開活動，再被問到如何與中央一起努力，以及努力方向？他的回答與昨天雷同，喊話中央訂專法統一管理制度與安全標準，讓地方政府有所依循。
