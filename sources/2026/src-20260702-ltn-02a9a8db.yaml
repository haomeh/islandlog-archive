title: 中聯大豆沙拉油苯駢芘超標 食藥署：請業者釐清製程
publisher: 自由時報
url: https://news.ltn.com.tw/news/life/breakingnews/5491645
published_on: '2026-07-02'
accessed_on: '2026-10-25'
