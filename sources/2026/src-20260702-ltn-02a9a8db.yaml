quote: 中聯油脂公司自主通報，泰山、福壽及福懋使用的一批大豆沙拉油，檢出致癌物「苯駢芘」（BaP）含量超標，並啟動下架回收。衛福部食藥署副署長蔡淑貞今（2）日在行政院會後記者會表示，中聯是從黃豆提煉大豆沙拉油，會出現苯駢芘超標涉及製程，正請工廠釐清，後續若需改善，食藥署將與台中市食安處共同確認。
section: 生活
byline: 記者鍾麗華
