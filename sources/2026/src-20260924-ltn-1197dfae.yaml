quote: 台北市金華國中驚傳師生食用含「小卷」的營養午餐後多人上吐下瀉，市議員簡舒培質疑教育局接獲通報竟消極要求「被動處理、暫不處理」，甚至任由校方丟棄午餐樣本採檢無門；對此教育局嚴正駁斥是烏龍爆料並排除集體中毒，市長蔣萬安也強調指控應有所本。然而，有自稱該校學生的網友爆料，當天小卷呈現詭異紅色，自己吃完嚴重
