quote: （中央社記者姜宜菁雲林縣23日電）雲林縣政府表示，依交通部中央氣象署今天發布颱風薔琵警報資料，雲林明天風力預測已達停止上班、停止上課標準，為確保民眾安全，雲林明天停班停課。（編輯：李明宗）1151023
