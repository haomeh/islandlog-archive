title: 141黨員涉殺人未遂、毒品近百案 刑事局：統促黨實為犯罪組織
publisher: 自由時報
url: https://news.ltn.com.tw/news/politics/paper/1764796
published_on: '2026-07-31'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 內政部長劉世芳昨召開記者會宣布，八月初將向憲法法庭聲請解散中華統一促進黨。內政部及刑事警察局羅列統促黨多項罪證，包括賄選、跨境鎮壓、配合中共統戰等，自二〇一〇年迄今有一四一名統促黨員涉犯殺人未遂、毒品等共九十八起組織犯罪案件，直指統促黨實為「披著政黨外衣的犯罪組織」。
section: 政治
byline: 記者林哲遠、陳鈺馥、鄭景議
