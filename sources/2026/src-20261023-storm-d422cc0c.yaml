quote: 中度颱風「薔琵」持續進逼台灣陸地，全台多達21縣市今（23）日停止上班上課。隨著颱風核心逐步靠近、北部風雨逐漸增強，許多市民急切關心「明天週六是否會繼續放颱風假？」對此，台北市長蔣萬安今日上午前往台北市災害應變中心（EOC）主持第2次工作會報時明確表態，基北北桃將維持一致步調，預計於今晚8點整同步宣
