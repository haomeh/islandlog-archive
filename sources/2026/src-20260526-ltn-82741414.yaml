quote: 台北市密室逃脫業者員工因角色扮演鬧出人命，台北市議員簡舒培昨指出，從五月十日事發至今，最重要的是亡羊補牢，卻只看到市府、甚至連第一線的局處首長都在推卸責任；事實上，內政部消防署早在二〇一七年二月八日頒布《互動情境體驗場所安全指導綱領》，市府卻從未依照綱領去檢查，將把資料送監察院要求彈劾台北市政府。北
