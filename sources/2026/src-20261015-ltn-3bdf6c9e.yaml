quote: 氣象專家指出，今晨受輻射冷卻作用影響，新竹關西低溫下探至16.5度，今日各地持續日夜溫差大，西部白天晴朗穩定，北、東迎風面有局部短暫雨，明日至下週二東側水氣漸減，天氣再轉為「秋老虎」型態，不過下週三東北季風增強，迎風面轉有雨。專家也提到，在關島東方海面的熱帶低壓，今將發展為輕颱「薔琵」，未來有繼續增
