quote: 男子林威良涉嫌自二〇一八年起，違法媒介印尼籍失聯移工至雇主處從事看護工作，並承租房屋設立宿舍集中管理，甚至夥同印尼籍移工透過熱門社群平台「TikTok」招攬同鄉加入，七年來累計向雇主收取四〇六九萬餘元。新北地檢署昨依違反就業服務法起訴林男及兩名印尼籍女共犯，並考量林男嚴重破壞我國就業服務及移工管理秩
