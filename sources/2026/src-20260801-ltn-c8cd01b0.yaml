title: 案發前 就與相關人有「隱匿案情共識」 中聯致癌油案再逆轉 廠長交保撤銷
publisher: 自由時報
url: https://news.ltn.com.tw/news/life/paper/1764854
published_on: '2026-08-01'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 中聯油脂一級致癌物「苯駢芘」超標案，檢方持續向上追查決策鏈，繼總經理余凌冲遭羈押禁見後，廠長陳明榮羈押攻防也出現逆轉，台中高分院審理後認定檢方抗告有理由，認為陳明榮案發前就已經跟相關人有「隱匿案情之共識」，撤銷台中地院命陳以兩百萬元交保裁定，發回台中地院重新更裁。
section: 生活
byline: 記者許國楨
