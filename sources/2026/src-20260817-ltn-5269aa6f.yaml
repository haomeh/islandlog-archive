quote: 桃園市大園親子館九月將舉辦「中國月」主題活動並將五星旗直接放在活動行事曆引爭議，館方昨日凌晨緊急下架並回應，九月活動依循過去主題月設計模式，沒有任何政治宣傳意圖，對於引發部分朋友的不安與疑慮感到非常抱歉，已下架並重新檢討題目及呈現方式。
