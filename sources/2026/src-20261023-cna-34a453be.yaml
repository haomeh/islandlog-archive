quote: （中央社記者郭宣彣新竹縣23日電）颱風薔琵影響，新竹縣政府今天表示，依交通部中央氣象署預測資料，新竹縣山區雨量、沿海風力達停止上班、停止上課標準，新竹縣明天停班停課。（編輯：李明宗）1151023
