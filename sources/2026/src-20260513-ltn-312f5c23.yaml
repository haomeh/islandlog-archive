quote: 備受期待的淡江大橋於昨日通車，未料通車僅進入第2天，便發生首起「連環追撞」事故！今中午12時許，台61線淡江大橋北上400公尺處，發生3輛自小客車追撞意外，所幸現場僅有車損，並未造成人員傷亡，虛驚一場。
