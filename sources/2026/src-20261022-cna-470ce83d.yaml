quote: （中央社記者潘欣彤連江縣22日電）連江縣政府今天晚間宣布，受到颱風薔琵暴風圈接近，風力已達停班停課標準，連江縣23日全日停班，全日停課。縣府並呼籲民眾做好防颱準備。（編輯：蕭博文）1151022
