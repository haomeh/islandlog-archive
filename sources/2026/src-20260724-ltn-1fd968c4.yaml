title: 竹市明好企業農耕牌炊粉驗出致癌甲醛重創米粉產業 米粉同業說話了
publisher: 自由時報
url: https://news.ltn.com.tw/news/life/breakingnews/5516729
published_on: '2026-07-24'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 新竹市爆出明好企業生產的農耕牌多款炊粉驗出含致癌甲醛，甲醛炊粉食安事件延燒1週，釀成新竹米粉產業風暴，除讓消費者擔憂所吃的炊粉，連其他米粉業者也受到波及牽連，新竹市米粉商業同業公會榮譽代表蔡勝興今天說話了，他說，打死都不相信明好企業農耕炊粉會使用甲醛，認為明好企業應是受害者，希望竹市衛生局能協助明好
section: 生活
byline: 記者洪美秀
