title: 桃園市蘆竹饋線跳脫釀565戶停電 好市多一度受影響
publisher: 自由時報
url: https://news.ltn.com.tw/news/life/breakingnews/5506110
published_on: '2026-07-15'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 桃園市蘆竹區中正路、南崁路、聯福街一帶，今天中午12點52分，因饋線跳脫而停電，影響周邊565戶停電，包括位於南崁路一段的好市多桃園南崁店也停電，讓民眾一度摸黑購物而驚呼：「桃園好市多停電初體驗！」
