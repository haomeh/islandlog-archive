quote: 日本北海道旭川市的旭山動物園一名男員工涉嫌殺妻焚屍，警方已經就此聲請逮捕令。這名職員的妻子仍然下落不明，警方調查園內的焚化爐過後，發現疑似為人體一部分的物體。
