quote: （中央社記者游凱翔台北21日電）颱風薔琵來襲，退輔會今天表示，所屬武陵、福壽山兩農場所在地將出現大雨或豪雨情形，並可能影響道路通行安全，為確保遊客及員工安全，明天中午12時起實施預警性休園、暫停對外開放，請民眾留意最新天氣資訊、農場官方網站及相關公告。
