quote: 高雄市楠梓警方巡邏經過高楠公路，赫見張姓男子騎乘註銷車牌機車闖紅燈，警方上前攔查，張男棄車拔腿狂奔，警方追逐30公尺，將他壓制逮捕，查出越南籍失聯移工，警訊後將他依違反入出國及移民法，移請移民署高雄市專勤隊遣送回國。
