quote: 日前民進黨台北市議員簡舒培爆料金華國中有學生吃小卷腹瀉，質疑營養午餐食安出問題。教育局回應強調，該校沒有出現集體食物中毒，反批不實指控。不過，近日仍有學生在社群發文表示，有其他同學出現身體不適。民進黨台北市長參選人沈伯洋今（25）日說，把檢體送驗告訴大家結果就好，難道要指責拉肚子的學生是造謠？市府回
