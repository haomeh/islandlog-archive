quote: 中聯油脂案影響範圍持續擴大，衛福部食藥署自事件爆出後陸續召開2場記者會對外說明相關案情，並陸續公布受影響業者與品項名單，但公衛師公會批評，食藥署對外說明時雖具備科學與專家資訊，卻始終沒能把重點放在「回應民眾焦慮」，也難以讓民眾判斷情況嚴重性或決定採取何種因應措施。
