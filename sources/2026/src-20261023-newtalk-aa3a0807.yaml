accessed_on: '2026-10-25'
has_archive_url: false
quote: 受秋颱「薔琵」強勁外圍環流與長浪衝擊，台東知名景點多良車站下方的路段，今(23)日傳出海岸邊坡遭巨浪淘刷，引發網友擔憂路基掏空危及行車安全。對此，公路局澄清，該路段主體路基並未損壞，實為靠海側原有覆土流失約40公尺；為確保安全，工程單位已於昨晚提前封閉海側車道進行交通管制，並緊急吊放消波塊穩固邊坡，
section: 生活
byline: 林冠妤
