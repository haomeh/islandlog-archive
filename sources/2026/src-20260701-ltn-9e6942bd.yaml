title: 中聯「大豆沙拉油」致癌物超標 泰山、福壽、福懋15品項火速下架
publisher: 自由時報
url: https://news.ltn.com.tw/news/life/breakingnews/5490726
published_on: '2026-07-01'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 中聯油脂生產的大豆沙拉油近期爆出一級致癌物「苯駢芘」超標，衛福部食藥署表示，相關產品以供應給泰山、福壽及福懋等中下游業者，同批號產品共計1300公噸、影響15個品項，目前業者已啟動回收機制，呼籲民眾若持有同批號產品，務必暫停食用，並依業者公布辦理退貨。
section: 生活
byline: 記者林志怡
