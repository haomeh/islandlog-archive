quote: 熱帶性低氣壓「TD33」今早（14日）成型，預估最快今晚增強為國際編號第30號（氣象署編號29號）颱風「薔琵」（Champi，寮國提供，花名），巔峰恐達強烈颱風，目前北轉點變數大，預報圖顯示後期路徑「天女散花」，將決定距離台灣遠近，持續追蹤觀察。
