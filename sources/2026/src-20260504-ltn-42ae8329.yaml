quote: 「淡江大橋開幕藝術季」系列活動邁入第三週，繼路跑、健行、遊行後，二日、三日再舉辦「跨越淡水 星空音樂會」及「淡海日與夜 我和大橋在一起」活動，累計兩天共吸引逾十五萬人次走上淡江大橋，以音樂、野餐、躺椅及展演活動，在十二日通車前體驗橋梁空間。
