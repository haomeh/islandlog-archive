quote: 基隆市東岸商場原營運商大日公司負責人蘇幸福，被控為取得東岸商場及信二立體停車場標案，5年間行賄基隆市府交通旅遊處臨時人員陳文輝共195萬元，陳男一審因不違背職務、違背職務收賄等罪，合併應執行12年徒刑。案經上訴，高等法院今認為一審量刑並無不當，駁回檢方及陳文輝上訴，陳男195萬元犯罪所得也維持沒收、
