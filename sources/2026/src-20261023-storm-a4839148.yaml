quote: 薔琵颱風持續影響台灣，台北市長蔣萬安今（23）日晚間宣布，經基北北桃共同討論評估，台北市明（24）日停止上班、停止上課。他今天也在臉書說明防颱整備進度，提醒市民非必要避免外出，貼文下出現支持連任的留言，還有網友喊話「我們做你的靠山！不怕什麼流」。
