quote: 中華統一促進黨長期配合中國統戰、滲透，涉及多起刑事暴力事件，內政部日前向憲法法庭聲請違憲解散。不過，安全單位比對後發現，今年九合一大選至少15名統促黨黨員或相關人士登記角逐各級民意代表，地點涵蓋北部與南部，與統促黨高度連結的參選人中逾8成有案底，令人憂心年底選舉被「染紅又染黑」。
