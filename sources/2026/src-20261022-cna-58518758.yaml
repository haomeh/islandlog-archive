quote: （中央社記者葉臻桃園22日電）颱風薔琵來襲，桃園市政府今天晚間宣布，依據最新天氣預報資料，明天達到停止上班上課標準，停止上班上課，市府也將持續注意颱風最新動態。（編輯：蕭博文）1151022
