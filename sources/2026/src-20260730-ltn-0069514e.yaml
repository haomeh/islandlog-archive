quote: 中聯油脂案引起全台食安疑慮，近期國民黨持續質疑衛福部下架相關決策過程，並指控會議過程可能有為業者護航情事，甚至出現「門神」說法。對此食藥署今天晚間澄清，相關說法與事實不符，也絕非事實。
