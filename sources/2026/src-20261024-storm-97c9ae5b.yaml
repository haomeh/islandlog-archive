quote: 近來社群平台流傳「外籍孕婦、學生福利」的圖卡及訊息，內容聲稱外籍勞工如果懷孕，一次可以領60天的薪資，還能放產檢假或是8周全薪休假，此外外籍學生也有一堆津貼，台灣人都沒有。貼文中更酸「賴總統說過啦：台灣是世界的台灣，​但是不是台灣人的台灣就不知道了。」對此，事實查核平台MyGoPen發布調查報告釋疑
