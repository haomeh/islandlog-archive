quote: 中聯油脂案引爆全台用油食安疑慮，也讓民眾質疑過去以「業者自律」為重的食安管理做法，另食品業者高層不具備食安專業也引發外界疑慮。對此衛福部長石崇良表示，這次業者惡意隱匿、延遲通報情況已交由檢調調查，衛福部也將依據這次案件調查結果，研擬「食安法」修法條文。
