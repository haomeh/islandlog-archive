quote: 中聯油脂生產的大豆沙拉油檢出致癌物「苯駢芘」（BaP）超標，預防下架產品規模超過2.7萬噸，美式賣場好市多（Costco）受牽連，全數預防性下架疑慮油製品，至於衛福部14日公布好市多報驗的美國冷凍綜合蔬菜，檢出大滅松等多項農藥超標，10公噸756.8公斤產品，業者依規退運銷毀。
