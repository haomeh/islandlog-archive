quote: （中央社記者曾以寧、陳俊華台北22日電）台灣前進陣線今天說，立法院修正「老人福利法」有條件補助長者健保費，是犧牲年輕世代、劫貧濟富，今天起啟動全台串連，參選人上街頭宣講。對此，人民監督健保聯盟發起人蘇偉碩說，台灣前進陣線的說法才會造成世代對立，他願公開辯論，追求健保改革方案。
