quote: 淡江大橋通車，交通部的公關爭議、機車道安全爭議仍懸而未決。國民黨新北市長參選人李四川今（14）日接受專訪時強調，機車道過窄問題必然要改善；淡江大橋是斜張橋，可以更動的就是快車道，他認為應要測量快車道是否仍有空間可讓機車道改善，起碼要讓機車道真正符合2.5米法令寬度，市府可以跟交通部協調，否則事故發生
