title: 中聯油脂案調查報告出爐 陳時中、石崇良15:00親上火線說明
publisher: 自由時報
url: https://news.ltn.com.tw/news/life/breakingnews/5519124
published_on: '2026-07-27'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 中聯油脂案延燒近1個月，衛福部食藥署除完成相關原油與終端產品檢驗外，也委託第三方調查單位持續調查案件原因，今日調查報告正式出爐，衛福部預計於下午3時召開記者會對外說明，且行政院政務委員陳時中、衛福部長石崇良、食藥署長姜至剛都將親上火線。
