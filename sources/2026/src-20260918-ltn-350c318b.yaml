title: 統促黨2人選里長 內政部尊重資格審查：若判決解散、不得推候選人
publisher: 自由時報
url: https://news.ltn.com.tw/news/politics/breakingnews/5578302
published_on: '2026-09-18'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 內政部認定統促黨長期危害國家安全，日前向憲法法庭聲請解散。不過，今年九合一大選，仍有15名相關人士登記參選，其中2人以統促黨名義參選里長。內政部今（18）日回應，若經判決違憲解散，即不得推薦候選人，而候選人資格則尊重選委會依法審定。據中選會公布的選務時程，預計在10月16日前完成參選人資格審查。
section: 政治
byline: 記者許詠晴
