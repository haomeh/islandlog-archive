quote: 基隆市東岸商場前年初發生經營權易主風波，基隆市長謝國樑指示警力強制排除占有、強制接管商場，原營運商大日的協力廠商、主富服裝公司（NET）聲請確認接管行為違法，並請求國家賠償2139萬元，台北高等行政法院去年裁定駁回；NET提抗告，最高行政法院今認定，強制接管行為屬「事實行為」，並非「行政處分」，不符
