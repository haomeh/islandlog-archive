quote: 新竹市爆出甲醛炊粉事件延燒近兩個月，民進黨新竹市議員劉崇顯、施乃如、楊玲宜昨表示，食安攸關市民健康，市府應以科學證據、完整資料及專業風險評估回應消費者疑慮，但衛生局長陳厚全竟聲稱甲醛炊粉「煮一煮就可以吃」，此離譜發言是在甩鍋卸責，誤導社會大眾錯估食品安全風險，要求市長高虹安、陳厚全下台負責。
