title: 竹市衛局長稱「甲醛炊粉煮一煮就可吃」 挨批錯誤衛教
publisher: 自由時報
url: https://news.ltn.com.tw/news/life/paper/1764749
published_on: '2026-07-31'
accessed_on: '2026-10-25'
