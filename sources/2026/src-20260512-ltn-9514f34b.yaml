quote: 淡江大橋今正式通車，交通部公路局早上在通車前舉辦通車祈福儀式，但未邀請新北市長侯友宜與市府參與，引發藍營民代砲轟交通部長陳世凱本應在立法院備詢，結果為了剪綵而請假。國民黨立委洪孟楷說，他嚴正抗議這種不尊重地方、國會、只重宣傳的離譜行徑；新北市議員江怡臻則說「人民要的是做事的交通部長，不是只出現在鏡頭
