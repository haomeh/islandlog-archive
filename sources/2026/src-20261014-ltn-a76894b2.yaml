quote: 週四（15日）東北季風減弱，中央氣象署預報，明天水氣仍較多，北北基、東半部仍有降雨，尤其宜蘭要留意局部較大雨勢，週五之後水氣減少，迎風面東半部有局部或零星降雨；另外，熱帶性低氣壓TD33預計今、明兩天發展成輕颱「薔琵」，週末可能增強到中颱上限，預估會以西北西轉北方向移動，但北轉角度、時間點仍有變數，
