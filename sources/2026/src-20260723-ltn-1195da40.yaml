quote: 新竹市爆明好企業生產的農耕牌炊粉被驗出不得添加及檢出的甲醛食安風暴，依市府衛生局提供的檢驗資料，應下架回收的甲醛炊粉效期有到2029年5月5日，但有眼尖的網友在網路查詢發文提到，農耕牌的多數炊粉保存效期是2年，但竹市府衛生局今年（2026年）6月初去抽驗，不應出現快3年後的有效期限標示，質疑不是業者
section: 生活
