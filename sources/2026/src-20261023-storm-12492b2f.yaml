quote: 今年第29號颱風「薔琵」（國際命名CHAMPI）步步進逼台灣，中央氣象署繼21日發布海警後，已於22日上午11時30分正式發布陸上颱風警報，全台各地、澎湖及馬祖均列入戒備範圍。根據最新觀測，薔琵颱風於23日上午8時中心位置已來到北緯22.6度、東經123.9度，正以每小時16轉11公里速度向西北轉北
