title: 颱風薔琵進逼　水利署展開防汛整備示警雙北等地加強警戒
publisher: 中央通訊社
url: https://www.cna.com.tw/news/ahel/202610210285.aspx
published_on: '2026-10-21'
accessed_on: '2026-10-25'
has_archive_url: false
quote: （中央社記者梁家柔台北21日電）颱風薔琵進逼，水利署今天召開防汛整備視訊會議，水利署長林元鵬盤點各分署整備情形，並要求各河川分署洽請縣市政府加速整備，落實與地方政府的防汛合作，也呼籲民眾與地方水利機關應加強清理水溝、放空滯洪池、檢整機具積極整備，務必嚴實部署，確保防洪設施均能正常運作。
section: 生活
byline: 梁家柔
