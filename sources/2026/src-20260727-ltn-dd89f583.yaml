quote: 新竹市爆出明好企業生產的農耕牌炊粉含不得添加及檢出的甲醛食安風暴，台南市衛生局早在5月底就已通報新竹市府，但高虹安市府直到7月18日才對外公布，至今仍未釐清問題炊粉的流向與來源。對此，曾多次踢爆高市府爭議、被封為「高虹安最強爆破士」的新竹市前文化局長錢康明在臉書發文強烈抨擊，痛批高市府處理食安態度極
