quote: 薔琵颱風來襲，高雄放颱風假，但位於市中心的左營區，不僅沒下雨，還出大太陽，但風勢頗強，導致大型廣告帆布被吹散、搖搖欲墜，警方已通知廣告公司派工程車到場緊急處置。
