quote: 高雄市楠梓所警員巡邏發現一輛轎車不當使用方向燈上前攔查，該車竟一路逃竄至楠梓區台糖花卉公園大門，4名移工見警爬鐵捲門逃竄，警方追逐壓制逮4人，其中阮姓男女2人為失聯移工，警訊後依違反入出國及移民法，移請移民署高雄市專勤隊遣送回國。
