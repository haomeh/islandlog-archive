title: 最高法院駁回八仙塵爆7受害者親屬國賠上訴  新北市府回應了
publisher: 自由時報
url: https://news.ltn.com.tw/news/society/breakingnews/5485217
published_on: '2026-06-26'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 2015年6月27日八仙樂園塵爆釀15死400多人傷，蘇姓民眾等7名受害者親屬認為交通部觀光署、新北市府怠於執行職務，聲請國賠，案件上訴至三審後，最高法院今駁回上訴，家屬獲賠2100萬確定。對此，新北市府回應，市府將於收到判決書後，依法定程序辦理賠償事宜，並依判決書所載檢討相關行政措施。
section: 社會
byline: 記者黃子暘
