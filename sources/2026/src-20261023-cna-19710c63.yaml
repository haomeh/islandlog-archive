quote: （中央社記者蘇木春台中23日電）颱風薔琵影響，台中市政府今天宣布，依交通部中央氣象署預報資料，台中地區風力等級已達停止上班、停止上課標準，台中明天停班停課。（編輯：李明宗）1151023
