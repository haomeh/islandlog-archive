quote: 新竹市爆出農耕牌炊粉含不得檢出的有毒甲醛，讓人傻眼的是，甲醛毒炊粉是台南市政府早在5月就驗出並通報竹市，高虹安市府卻拖到7月中才對外公布；地方家長們自發調查比對，發現毒炊粉恐已流入校園被學生們吃下肚，引發輿論撻伐。而今高虹安市府發聲稱絕無此等情事，揚言繼續講這件事就「依法辦理」，政治工作者周軒怒轟：
