quote: 近期遭內政部認定長期危害國家安全並聲請解散的中華統一促進黨總裁「白狼」張安樂，其兒媳王姝茵因地下匯兌逾1507萬元，判刑1年7月定讞，今赴台北地檢署報到，經拆除科技監控手環後發監；兒子張瑋則因業務侵占等罪判刑確定，卻棄保潛逃遭通緝。
