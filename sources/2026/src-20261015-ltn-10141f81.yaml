quote: 今年第29號颱風「薔琵」已於今（15日）下午生成，對此，氣象粉專「台灣颱風論壇─天氣特急」指出，薔琵本週不會影響台灣天氣，但北轉的位置是影響台灣的關鍵，此外由於沿途海洋與大氣環境有利颱風發展，薔琵可能會成長為強颱，預測下週四（22日）到週六（24日）會最靠近台灣。
