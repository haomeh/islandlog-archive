quote: 淡江大橋5月12日通車後，假日湧入大量人潮與車潮，新北市交通局近日邀集交通部公路局等單位開會，針對人行安全、車流疏導及停車秩序提出多項改善措施，其中鄰近大橋兩端的4處YouBike站，假日午後「只還不借」，部分易壅塞路口只允許右轉，並調整號誌週期，最快本週上路。
