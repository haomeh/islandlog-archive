quote: 薔琵颱風對中部地區的影響逐漸減弱，台中各大百貨購物中心於24日幾乎全面恢復營業，其中漢神洲際百貨適逢週年慶，開門時刻便湧現大批人潮，新光三越、大遠百門口也有不少民眾提早等候，不過鹿港老街的遊客人數則尚未回溫，當地店家表示人潮較以往連假減少約3成。
