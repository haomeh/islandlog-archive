quote: （中央社記者何秀玲、張建中台北23日電）薔琵颱風來襲，多家百貨今天調整營業時間，包括台北101、新光三越、遠東SOGO、微風及宏匯廣場均宣布暫停營業一天，其中新光三越全台16家分店，以及台北車站、SKM Park Outlets高雄草衙均停止營業。至於量販超市的好市多、萬家福今天正常營業。
