title: 臉書散播高雄人吃馬鈴薯中毒 男遭起訴求重刑
publisher: 自由時報
url: https://news.ltn.com.tw/news/society/paper/1753561
published_on: '2026-05-05'
accessed_on: '2026-10-25'
has_archive_url: false
quote: 桃園市五十一歲汪姓男子接續在數個臉書粉專貼文指「高雄有多人因食用馬鈴薯中毒」，桃園地檢署立即指揮調查局資安工作站偵辦，四月廿七日約談汪男到案說明，法官裁定二萬元交保；檢方昨表示，全案已於四月卅日火速偵結，依食品安全衛生管理法之散播有關食品安全之不實訊息罪嫌將汪男起訴，並建請法院從重量刑。
section: 社會
byline: 記者余瑞仁
