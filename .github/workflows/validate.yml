# Content validation for archive. It runs the pinned server image (PRD FR-131).
# Never use the `latest` tag. Raise ISLANDLOG_SERVER_VERSION only in a reviewed PR.
# CLI form (ruling R25): islandlog validate [--mode full|mr] [--base <git sha>] [--include-fixtures] <archive dir>.
# PR fields come from the event payload. A warning prints "LABEL privacy-review" and exits 0.
# OPEN QUESTION: the image is in registry.gitlab.com/howmay/islandlog/server.
# A pull from GitHub Actions needs the GitLab registry to allow public pulls.

name: validate

on:
  pull_request:
  push:
    branches: [main]

env:
  # PLACEHOLDER: no server release exists yet (D19). Replace with the first tag.
  ISLANDLOG_SERVER_VERSION: "v0.0.0"
  ISLANDLOG_IMAGE: "registry.gitlab.com/howmay/islandlog/server"

permissions:
  contents: read

jobs:
  validate-content:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/howmay/islandlog/server:v0.0.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: islandlog validate .

  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    container:
      image: registry.gitlab.com/howmay/islandlog/server:v0.0.0
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BODY: ${{ github.event.pull_request.body }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate in PR mode
        run: |
          islandlog validate --mode mr --base "$BASE_SHA" . | tee validate.out
      - name: Apply the privacy-review label
        run: |
          if grep -qx "LABEL privacy-review" validate.out; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label privacy-review
          fi
